name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ig-dash-ui
      - uses: actions/checkout@v4
        with:
          repository: asrulazwan0/ig-dash-core
          path: ig-dash-core
      - name: Configure disposable database
        working-directory: ig-dash-core
        run: |
          cp .env.example .env
          printf '\nIGDASH_PUBLIC_ORIGIN=http://ui:5173\n' >> .env
          printf '\nIGDASH_DEMO_PASSWORD=Demo-123!%s\n' "$(openssl rand -hex 16)" >> .env
      - name: Apply migrations
        working-directory: ig-dash-core
        run: |
          docker compose -f compose.workspace.yaml up -d --wait postgres
          docker compose -f compose.workspace.yaml --profile tools run --build --rm migrate
      - name: Verify demo seeding
        working-directory: ig-dash-core
        run: |
          docker compose -f compose.workspace.yaml --profile tools run --build --rm seed
          docker compose -f compose.workspace.yaml --profile tools run --rm seed > /tmp/igdash-seed-rerun.log
          python3 -c "assert 'Demo seed complete: 0 users and 0 logs created.' in open('/tmp/igdash-seed-rerun.log').read()"
      - name: Start application
        working-directory: ig-dash-core
        run: |
          # The API integration suite checks throttling; browser journeys share one test IP.
          printf 'services:\n  api:\n    environment:\n      RateLimits__AccountsPerMinute: "1000"\n' > compose.browser.yaml
          docker compose -f compose.workspace.yaml -f compose.browser.yaml up --build -d --wait postgres api ui
      - name: Verify browser workflows
        working-directory: ig-dash-core
        run: docker compose -f compose.workspace.yaml --profile tools run --build --rm browser-tests
      - name: Container diagnostics
        if: failure()
        working-directory: ig-dash-core
        run: docker compose -f compose.workspace.yaml logs --tail 100 api ui
      - name: Remove disposable stack
        if: always()
        working-directory: ig-dash-core
        run: docker compose -f compose.workspace.yaml --profile tools down -v
